name: Deploy Digo-Chatbot to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Digo Chatbot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend (React)
        working-directory: frontend
        run: |
          npm install
          VITE_API_BASE_URL=/api npm run build

      - name: Build Backend (NestJS)
        working-directory: backend
        env:
          DATABASE_URL: "mysql://placeholder:placeholder@localhost:3306/db"
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: Deploy to Tencent Cloud Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Ensuring remote directories exist..."
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "mkdir -p /var/www/digo-chatbot/backend /var/www/digo-chatbot/frontend/dist"

          echo "Syncing frontend static build..."
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete frontend/dist/ "$SERVER_USER@$SERVER_IP:/var/www/digo-chatbot/frontend/dist/"

          echo "Syncing backend compiled dist..."
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete backend/dist/ "$SERVER_USER@$SERVER_IP:/var/www/digo-chatbot/backend/dist/"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" backend/prisma/ "$SERVER_USER@$SERVER_IP:/var/www/digo-chatbot/backend/prisma/"
          scp -o StrictHostKeyChecking=no backend/package.json backend/package-lock.json "$SERVER_USER@$SERVER_IP:/var/www/digo-chatbot/backend/"

          echo "Installing production dependencies, running Prisma migrations & restarting PM2..."
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
            cd /var/www/digo-chatbot/backend &&
            npm install --omit=dev --prefer-offline &&
            npx prisma generate &&
            npx prisma migrate deploy &&
            (pm2 describe digo-backend > /dev/null 2>&1 && pm2 restart digo-backend --update-env || PORT=8000 pm2 start dist/main.js --name digo-backend) &&
            pm2 save
          "
          echo "✅ Digo-Chatbot successfully deployed!"
